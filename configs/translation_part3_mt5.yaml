# Part 3 mT5-decoder-adapter experiment (tri-modal + fixed pool + pretrained mT5 decoder).
# Decoder-backbone swap on top of translation_part3_pool.yaml (the 0.217 BLEU-1 baseline):
# identical frozen settings, only the Chinese decoder is replaced by the mT5-small adapter.
root: .
split: train

data:
  manifest: manifests/ce-csl.csv
  label_dir: raw/CE-CSL/label

model:
  hidden_dim: 256
  num_heads: 8
  num_layers: 3
  feedforward_dim: 1024
  dropout: 0.1
  gloss_aux_weight: 0.0
  decoder_backbone: mt5
  mt5_path: /mnt/d/part3_models/mt5-small-saved
  mt5_max_target_tokens: 64
  decoder:
    type: transformer
    hidden_dim: 256
    num_layers: 3
    num_heads: 8
    max_target_len: 128
    dropout: 0.1

fusion:
  modalities: [rgb, motion, landmark]
  num_heads: 8
  num_layers: 2
  dropout: 0.1
  num_pool_tokens: 32

smoke:
  train_steps: 15
  dev_limit: 3
  synthetic_features: true
  seed: 0

device: cuda